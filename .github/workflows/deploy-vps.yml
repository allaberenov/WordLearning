name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  build_image:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image.outputs.image }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="${image}:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${image}"
          echo "IMAGE_TAG=${image_tag}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_vps:
    name: Deploy to VPS
    needs: build_image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Create remote directories
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_APP_DIR/docker' '$VPS_APP_DIR/scripts'"

      - name: Write production env
        env:
          APP_IMAGE: ${{ needs.build_image.outputs.image_tag }}
          APP_BIND: ${{ secrets.APP_BIND }}
          APP_PORT: ${{ secrets.APP_PORT }}
          RUN_MIGRATIONS: ${{ vars.RUN_MIGRATIONS || 'true' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          GEMINI_TIMEOUT_MS: ${{ vars.GEMINI_TIMEOUT_MS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3-32b' }}
          GROQ_BASE_URL: ${{ vars.GROQ_BASE_URL || 'https://api.groq.com/openai/v1' }}
          GROQ_TIMEOUT_MS: ${{ vars.GROQ_TIMEOUT_MS || '20000' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          DOMAIN: ${{ vars.DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
        run: |
          set -euo pipefail
          {
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
            printf 'APP_BIND=%s\n' "${APP_BIND:-0.0.0.0}"
            printf 'APP_PORT=%s\n' "${APP_PORT:-3000}"
            printf 'RUN_MIGRATIONS=%s\n' "${RUN_MIGRATIONS:-true}"
            printf '\n'
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf '\n'
            printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET"
            printf '\n'
            printf 'AI_PROVIDER=%s\n' "${AI_PROVIDER:-gemini}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-flash-latest}"
            printf 'GEMINI_BASE_URL=%s\n' "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}"
            printf 'GEMINI_TIMEOUT_MS=%s\n' "${GEMINI_TIMEOUT_MS:-30000}"
            printf '\n'
            printf 'GROQ_API_KEY=%s\n' "${GROQ_API_KEY:-}"
            printf 'GROQ_MODEL=%s\n' "${GROQ_MODEL:-qwen/qwen3-32b}"
            printf 'GROQ_BASE_URL=%s\n' "${GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
            printf 'GROQ_TIMEOUT_MS=%s\n' "${GROQ_TIMEOUT_MS:-20000}"
            printf '\n'
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY:-}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-4o-mini}"
            if [ -n "${DOMAIN:-}" ]; then
              printf '\nDOMAIN=%s\n' "$DOMAIN"
            fi
            if [ -n "${WWW_DOMAIN:-}" ]; then
              printf 'WWW_DOMAIN=%s\n' "$WWW_DOMAIN"
            fi
          } > .env.production

      - name: Upload deploy files
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" \
            docker-compose.prod.yml \
            docker-compose.caddy.yml \
            .env.production \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" \
            docker/Caddyfile \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/docker/Caddyfile"
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" \
            scripts/deploy-vps.sh \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/scripts/deploy-vps.sh"
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "chmod 600 '$VPS_APP_DIR/.env.production' && chmod +x '$VPS_APP_DIR/scripts/deploy-vps.sh'"

      - name: Login to GHCR on VPS
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy containers
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          VPS_ENABLE_CADDY: ${{ vars.VPS_ENABLE_CADDY || 'false' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && ENABLE_CADDY='$VPS_ENABLE_CADDY' ./scripts/deploy-vps.sh"

      - name: Logout from GHCR on VPS
        if: always()
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker logout ghcr.io || true" || true

      - name: Health check
        env:
          VPS_HEALTHCHECK_URL: ${{ secrets.VPS_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HEALTHCHECK_URL:-}" ]; then
            echo "VPS_HEALTHCHECK_URL is not set, skipping health check"
            exit 0
          fi
          for i in {1..30}; do
            if curl -fsS "$VPS_HEALTHCHECK_URL/login" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          exit 1

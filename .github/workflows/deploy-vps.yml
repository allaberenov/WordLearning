name: Deploy VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - master
    types:
      - completed

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Create remote directory
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR'"

      - name: Upload project
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_key -p $VPS_PORT" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude ".next" \
            --include ".env.production.example" \
            --exclude ".env" \
            --exclude ".env.*" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Write production env
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          APP_BIND: ${{ secrets.APP_BIND }}
          APP_PORT: ${{ secrets.APP_PORT }}
          RUN_MIGRATIONS: ${{ vars.RUN_MIGRATIONS || 'true' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
          GEMINI_TIMEOUT_MS: ${{ vars.GEMINI_TIMEOUT_MS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          set -euo pipefail
          {
            printf 'APP_BIND=%s\n' "${APP_BIND:-0.0.0.0}"
            printf 'APP_PORT=%s\n' "${APP_PORT:-3000}"
            printf 'RUN_MIGRATIONS=%s\n' "${RUN_MIGRATIONS:-true}"
            printf '\n'
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf '\n'
            printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET"
            printf '\n'
            printf 'AI_PROVIDER=%s\n' "${AI_PROVIDER:-gemini}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-flash-latest}"
            printf 'GEMINI_BASE_URL=%s\n' "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}"
            printf 'GEMINI_TIMEOUT_MS=%s\n' "${GEMINI_TIMEOUT_MS:-30000}"
            printf '\n'
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY:-}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-4o-mini}"
            if [ -n "${DOMAIN:-}" ]; then
              printf '\nDOMAIN=%s\n' "$DOMAIN"
            fi
          } > .env.production
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" .env.production "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/.env.production"
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod 600 '$VPS_APP_DIR/.env.production'"

      - name: Deploy containers
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          VPS_ENABLE_CADDY: ${{ vars.VPS_ENABLE_CADDY || 'false' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_DIR' && chmod +x scripts/deploy-vps.sh && ENABLE_CADDY='$VPS_ENABLE_CADDY' ./scripts/deploy-vps.sh"

      - name: Health check
        env:
          VPS_HEALTHCHECK_URL: ${{ secrets.VPS_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HEALTHCHECK_URL:-}" ]; then
            echo "VPS_HEALTHCHECK_URL is not set, skipping health check"
            exit 0
          fi
          for i in {1..30}; do
            if curl -fsS "$VPS_HEALTHCHECK_URL/login" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          exit 1
